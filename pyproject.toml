[build-system]
requires = ["setuptools >= 75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PanGenomeTools"
version = "0.0.1"
authors = [
  { name="Tobias Pfennig", email="author@example.com" },
]
description = "A package for interacting with pan-genome"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/pfennigt/PanGenomeTools"
Issues = "https://github.com/pfennigt/PanGenomeTools/issues"