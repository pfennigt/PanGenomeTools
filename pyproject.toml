[build-system]
requires = ["setuptools <= 77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PanGenomeTools"
version = "0.0.1"
authors = [
  { name="Tobias Pfennig", email="author@example.com" },
]
description = "A package for interacting with pan-genome"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {text = "MIT"}
dependencies = [
    "pyranges>=0.0.100",
    "pyfaidx>=0.7.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "tqdm>=4.62.0",
    "pyBigWig>=0.3.18",
    "biopython>=1.79",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=3.0.0",
    "black>=21.9b0",
    "flake8>=4.0.1",
    "mypy>=0.910",
    "isort>=5.9.3",
]

[project.urls]
Homepage = "https://github.com/pfennigt/PanGenomeTools"
Issues = "https://github.com/pfennigt/PanGenomeTools/issues"